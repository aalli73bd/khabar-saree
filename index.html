<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MASAMUNE — Global News</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f5f7;
    color: #111827;
}

header {
    background: #0b0f19;
    color: white;
    padding: 18px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
}

.logo span {
    color: #e11d48;
}

nav {
    display: flex;
    gap: 20px;
}

nav a {
    color: #d1d5db;
    text-decoration: none;
    font-size: 14px;
}

nav a:hover {
    color: white;
}

.breaking {
    background: #e11d48;
    color: white;
    padding: 11px 6%;
    font-size: 14px;
    font-weight: bold;
}

.hero {
    background: #111827;
    color: white;
    padding: 55px 6%;
}

.hero h1 {
    font-size: clamp(36px, 7vw, 70px);
    margin: 0 0 12px;
    letter-spacing: 3px;
}

.hero p {
    color: #9ca3af;
    font-size: 18px;
    margin: 0;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 35px 20px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.section-title h2 {
    margin: 0;
}

.refresh {
    border: 0;
    background: #111827;
    color: white;
    padding: 10px 16px;
    border-radius: 7px;
    cursor: pointer;
}

.news-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.news {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    transition: transform 0.2s;
}

.news:hover {
    transform: translateY(-4px);
}

.news-image {
    width: 100%;
    height: 190px;
    object-fit: cover;
    background: #e5e7eb;
}

.news-content {
    padding: 18px;
}

.news h3 {
    margin: 0 0 10px;
    font-size: 19px;
    line-height: 1.4;
}

.description {
    color: #6b7280;
    line-height: 1.6;
    font-size: 14px;
}

.meta {
    color: #9ca3af;
    font-size: 12px;
    margin-bottom: 12px;
}

.read {
    display: inline-block;
    margin-top: 10px;
    color: #e11d48;
    text-decoration: none;
    font-weight: bold;
}

footer {
    background: #0b0f19;
    color: #9ca3af;
    text-align: center;
    padding: 30px;
    margin-top: 40px;
}

@media (max-width: 800px) {
    nav {
        display: none;
    }

    .news-grid {
        grid-template-columns: 1fr;
    }

    .hero {
        padding: 40px 20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MASAMUNE<span>.</span></div>

    <nav>
        <a href="#">World</a>
        <a href="#">Technology</a>
        <a href="#">Business</a>
        <a href="#">Sports</a>
        <a href="#">Science</a>
    </nav>
</header>

<div class="breaking">
    🔴 BREAKING NEWS
</div>

<section class="hero">
    <h1>MASAMUNE</h1>
    <p>Independent global news, updated from around the world.</p>
</section>

<main class="container">

    <div class="section-title">
        <h2>Latest News</h2>
        <button class="refresh" onclick="loadNews()">↻ Refresh</button>
    </div>

    <div class="news-grid" id="news">
        Loading news...
    </div>

</main>

<footer>
    © 2026 MASAMUNE — Global News
</footer>

<script>

const API =
"https://khabar-api.lwsylfr78.workers.dev/news";

async function loadNews() {

    const container = document.getElementById("news");

    container.innerHTML = "Loading news...";

    try {

        const response = await fetch(API);

        const data = await response.json();

        if (!data.articles || data.articles.length === 0) {

            container.innerHTML =
            "<p>No news available right now.</p>";

            return;
        }

        container.innerHTML =
        data.articles.map(article => `

            <article class="news">

                ${
                    article.image
                    ?
                    `<img class="news-image"
                    src="${article.image}"
                    alt="">`
                    :
                    `<div class="news-image"></div>`
                }

                <div class="news-content">

                    <div class="meta">
                        ${article.source?.name || "World News"}
                    </div>

                    <h3>
                        ${article.title || "Untitled"}
                    </h3>

                    <p class="description">
                        ${article.description || ""}
                    </p>

                    <a
                    class="read"
                    href="${article.url}"
                    target="_blank">
                    Read full story →
                    </a>

                </div>

            </article>

        `).join("");

    }

    catch (error) {

        container.innerHTML =
        "<p>Unable to load news right now.</p>";

    }
}

loadNews();

</script>

</body>
    </html>
