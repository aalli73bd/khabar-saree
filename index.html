<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خبر سريع</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 25px;
}

header h1 {
    margin: 0;
}

.breaking {
    background: #d00000;
    color: white;
    text-align: center;
    padding: 12px;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: 20px auto;
    padding: 10px;
}

.news {
    background: white;
    margin-bottom: 15px;
    padding: 18px;
    border-radius: 10px;
}

.news h2 {
    margin-top: 0;
}

.time {
    color: #777;
    font-size: 14px;
}
</style>
</head>

<body>

<header>
    <h1>خبر سريع</h1>
    <p>آخر الأخبار في مكان واحد</p>
</header>

<div class="breaking">
    🔴 أخبار عاجلة
</div>

<div class="container">

    <div class="news">
        <h2>أول خبر في موقعنا</h2>
        <div class="time">منذ قليل</div>
        <p>
            هذا خبر تجريبي. لاحقًا سنربط الموقع بمصدر الأخبار
            ليتم عرض الأخبار الحقيقية تلقائيًا.
        </p>
    </div>

    <div class="news">
        <h2>خبر جديد</h2>
        <div class="time">اليوم</div>
        <p>
            موقع الأخبار الخاص بنا أصبح جاهزًا كبداية.
        </p>
    </div>

</div>

</body>
</html>
