<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خبر سريع</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
}

header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 25px;
}

header h1 {
    margin: 0;
}

.breaking {
    background: #d00000;
    color: white;
    text-align: center;
    padding: 12px;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: 20px auto;
    padding: 10px;
}

.news {
    background: white;
    margin-bottom: 15px;
    padding: 18px;
    border-radius: 10px;
}

.news h2 {
    margin-top: 0;
}

.time {
    color: #777;
    font-size: 14px;
}

.news a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>خبر سريع</h1>
    <p>آخر الأخبار العالمية</p>
</header>

<div class="breaking">
    🔴 آخر الأخبار
</div>

<div class="container" id="news">
    جارٍ تحميل الأخبار...
</div>

<script>
const API = "https://khabar-api.lwsylfr78.workers.dev/news";

async function loadNews() {
    const container = document.getElementById("news");

    try {
        const response = await fetch(API);
        const data = await response.json();

        if (!data.articles || data.articles.length === 0) {
            container.innerHTML = "<p>لا توجد أخبار حاليًا.</p>";
            return;
        }

        container.innerHTML = data.articles.map(article => `
            <div class="news">
                <h2>${article.title || "بدون عنوان"}</h2>
                <div class="time">${article.publishedAt || ""}</div>
                <p>${article.description || "لا يوجد وصف للخبر."}</p>
                <a href="${article.url}" target="_blank">
                    اقرأ الخبر كاملًا
                </a>
            </div>
        `).join("");

    } catch (error) {
        container.innerHTML =
            "<p>حدث خطأ أثناء تحميل الأخبار.</p>";
    }
}

loadNews();
</script>

</body>
</html>
